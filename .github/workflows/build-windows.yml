name: 打包 Windows 執行檔

# 推送到開發分支、打 tag（v*），或手動觸發時，於雲端 Windows 機器打包 .exe
on:
  push:
    branches:
      - "claude/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "填入版本標籤（例如 v1.0）即建立正式 Release；留空只產生下載產物"
        required: false
        default: ""

permissions:
  contents: write   # 打 tag 時建立 Release 需要

env:
  PYTHONUTF8: "1"   # 讓 Windows 上的 Python 用 UTF-8 輸出，避免中文 print 崩潰

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller tkinterdnd2 openpyxl xlrd

      - name: 打包單一執行檔
        run: python packaging/build_app.py

      - name: 上傳執行檔（Actions 產物，可直接下載）
        uses: actions/upload-artifact@v4
        with:
          name: 應付帳款預填-windows
          path: dist/*.exe
          if-no-files-found: error

      # GitHub Release 附件不接受非 ASCII 檔名（會被改成 default.exe），
      # 故把中文名的 exe 打包進 ASCII 檔名的 zip，解壓後即為「應付帳款預填.exe」。
      - name: 壓縮成 zip（保留中文 exe 檔名）
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        run: Compress-Archive -Path dist/*.exe -DestinationPath dist/PayableFiller-Windows.zip -Force

      - name: 發佈到 Release（打 v* tag，或手動填入 release_tag）
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # tag 觸發用該 tag；手動觸發用輸入的版本，並在此 commit 上建立 tag
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: 應付帳款自動預填工具 ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          body: |
            支票辨識產出 → 應付帳款明細表 自動預填工具。

            下載 `PayableFiller-Windows.zip`，解壓後得到 **應付帳款預填.exe**，
            與 `customer_master.xls` 放同一資料夾後雙擊即用。
          files: dist/PayableFiller-Windows.zip

      - name: 清除舊的 default.exe 附件（若存在）
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}"
          gh release delete-asset "$tag" default.exe -y 2>$null; exit 0
